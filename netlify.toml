[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"
  # The Gatsby build plugin is still enabled on the Netlify project from before the move to Astro,
  # and crashes looking for Gatsby's cache. This turns it off until it is removed in the dashboard.
  NETLIFY_SKIP_GATSBY_BUILD_PLUGIN = "true"

# llms.txt and robots.txt are read by machines that care about the charset.
[[headers]]
  for = "/*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
