<!doctype html>
<!-- The social card, 1200x630. `yarn og` screenshots it to public/og.png. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Space+Grotesk:wght@500&family=JetBrains+Mono:wght@400&display=block"
			rel="stylesheet"
		/>
		<style>
			* { margin: 0; box-sizing: border-box; }
			html, body { width: 1200px; height: 630px; overflow: hidden; }
			body {
				background-color: #f7f4ee;
				background-image: radial-gradient(rgba(27, 25, 22, 0.14) 1.2px, transparent 1.2px);
				background-size: 28px 28px;
				color: #1b1916;
				font-family: 'Instrument Sans', sans-serif;
				padding: 72px 80px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
			}
			.mark { display: flex; align-items: center; gap: 18px; font-size: 26px; font-weight: 500; }
			.mark svg { width: 56px; height: 56px; }
			h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 88px; line-height: 0.98; letter-spacing: -0.045em; max-width: 19ch; }
			em { font-style: normal; color: #b5491f; }
			.foot { display: flex; justify-content: space-between; align-items: end; border-top: 2px solid #1b1916; padding-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; color: #4b4740; }
		</style>
	</head>
	<body>
		<div class="mark">
			<svg viewBox="0 0 40 40" fill="none"><rect x="0.75" y="0.75" width="38.5" height="38.5" rx="10" fill="#1b1916" stroke="#1b1916" stroke-width="1.5" /><g transform="translate(5.6 8.5) scale(.72)"><path d="M3 27 L10.5 5 L18 27 L23.5 27 V5 H29.5 a6.25 6.25 0 0 1 0 12.5 H23.5 M6.6 19.5 H14.4" stroke="#f7f4ee" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="37" cy="27" r="3" fill="#b5491f" /></g></svg>
			Adrien Poirson
		</div>
		<h1>I build software that turns complicated data into something <em>clear.</em></h1>
		<div class="foot"><span>Senior full-stack engineer — Vancouver</span><span>adrien-poirson.dev</span></div>
	</body>
</html>
