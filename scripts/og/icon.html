<!doctype html>
<!-- The favicon at 180x180 for iOS home screens. `yarn og` screenshots it to public/apple-touch-icon.png. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			* { margin: 0; }
			html, body { width: 180px; height: 180px; overflow: hidden; background: #1b1916; }
			svg { display: block; width: 180px; height: 180px; }
		</style>
	</head>
	<body>
		<!-- No rounded corners: iOS masks the icon itself. -->
		<svg viewBox="0 0 40 40" fill="none"><rect width="40" height="40" fill="#1b1916" /><g transform="translate(5.6 8.5) scale(.72)"><path d="M3 27 L10.5 5 L18 27 L23.5 27 V5 H29.5 a6.25 6.25 0 0 1 0 12.5 H23.5 M6.6 19.5 H14.4" stroke="#f7f4ee" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="37" cy="27" r="3" fill="#b5491f" /></g></svg>
	</body>
</html>
