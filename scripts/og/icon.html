<!doctype html>
<!-- The favicon at 180x180 for iOS home screens. `yarn og` screenshots it to public/apple-touch-icon.png. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=block" rel="stylesheet" />
		<style>
			* { margin: 0; }
			html, body { width: 180px; height: 180px; overflow: hidden; background: #1b1916; }
			svg { display: block; width: 180px; height: 180px; }
		</style>
	</head>
	<body>
		<!-- No rounded corners: iOS masks the icon itself. -->
		<svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#1b1916" /><text x="25" y="46" text-anchor="middle" font-family="Instrument Serif" font-size="44" fill="#f7f4ee">A</text><circle cx="47" cy="42" r="4.5" fill="#b5491f" /></svg>
	</body>
</html>
